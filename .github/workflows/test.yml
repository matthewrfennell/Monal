name: Run automated tests

on:
  pull_request:
    branches:
      - develop
      - beta
      - stable
      - quicksy
  push:
    branches:
      - develop
  workflow_dispatch:

permissions: {}

jobs:
  run_tests:
    runs-on: macos-15
    name: Run automated tests
    steps:
      - name: Can resolve DNS?
        run: nslookup chat.ephemeral-xmpp-server.org
      - name: Can connect to 5222?
        run: timeout 30 nc -zv chat.ephemeral-xmpp-server.org 5222
      - name: Can connect to 5223?
        run: timeout 30 nc -zv chat.ephemeral-xmpp-server.org 5223
