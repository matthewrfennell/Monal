name: Run automated tests

on:
  pull_request:
    branches:
      - develop
      - beta
      - stable
      - quicksy
  push:
    branches:
      - develop
  workflow_dispatch:

permissions: {}

jobs:
  run_tests:
    runs-on: macos-15
    name: Run automated tests
    steps:
      - name: Checkout submodules
        run: nslookup chat.ephemeral-xmpp-server.org
